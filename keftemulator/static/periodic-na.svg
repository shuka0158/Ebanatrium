<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="120" height="140" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  
  <!-- Atomic Number (11) - Top Left -->
  <text x="8" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000">11</text>
  
  <!-- Element Symbol (Na) - Center, Large -->
  <text x="60" y="85" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#00ff88" text-anchor="middle">Na</text>
  
  <!-- Element Name (Sodium) -->
  <text x="60" y="108" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#000000" text-anchor="middle">Sodium</text>
  
  <!-- Atomic Mass (22.99) - Bottom -->
  <text x="60" y="130" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#333333" text-anchor="middle">22.99</text>
  
  <!-- Category indicator line -->
  <line x1="0" y1="25" x2="120" y2="25" stroke="#e0e0e0" stroke-width="0.5"/>
  <line x1="0" y1="115" x2="120" y2="115" stroke="#e0e0e0" stroke-width="0.5"/>
</svg>
